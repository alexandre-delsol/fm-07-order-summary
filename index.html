<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <title>Frontend Mentor | Order summary card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <section class="order-card">
      <img class="order-card__hero" src="./images/illustration-hero.svg" alt="">
      <div class="order-card__content">
        <h1 class="order-card__title">Order Summary</h1>

        <p class="order-card__description">
          You can now listen to millions of songs, audiobooks, and podcasts on any
          device anywhere you like!
        </p>

        <div class="annual-plan">
          <img class="annual-plan__icon" src="./images/icon-music.svg" alt="">

          <div class="annual-plan__details">
            <p class="annual-plan__name">Annual Plan</p>
            <p class="annual-plan__price">$59.99/year</p>
          </div>

          <a class="annual-plan__change" href="#">Change</a>
        </div>

        <button class="payment-button" type="button">
          Proceed to Payment
        </button>

        <button class="cancel-button" type="button">
          Cancel Order
        </button>
      </div>

    </section>
    
  </main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io/profile/alexandre-delsol">
      Frontend Mentor
    </a>.
    Coded by
    <a href="https://github.com/alexandre-delsol">
      Alexandre DELSOL
    </a>.
  </footer>
</body>

</html>
